// Suppress browser gestures without stopping Pointer Events used by the joystick
// and action buttons. Single taps still activate menu/settings buttons.
const cancelBrowserGesture=e=>{if(e.cancelable)e.preventDefault()};
for(const type of ['gesturestart','gesturechange','gestureend','dblclick','contextmenu','selectstart','dragstart'])
 document.addEventListener(type,cancelBrowserGesture,{passive:false,capture:true});
document.addEventListener('touchmove',e=>{if(e.touches.length===1&&e.target.closest?.('.card-main'))return;cancelBrowserGesture(e)},{passive:false,capture:true});
document.addEventListener('touchstart',e=>{if(e.touches.length>1)cancelBrowserGesture(e)},{passive:false,capture:true});
let lastTap=null;
document.addEventListener('touchend',e=>{
 const t=e.changedTouches[0];if(!t)return;
 const ui=e.target.closest?.('button,select,option,input,textarea,a');
 const pointerControl=e.target.closest?.('.controls');
 // Pointer controls do not need synthesized clicks. Menus retain single taps.
 if(pointerControl||!ui)cancelBrowserGesture(e);
 else if(lastTap&&lastTap.target===ui&&e.timeStamp-lastTap.time<350&&Math.hypot(t.clientX-lastTap.x,t.clientY-lastTap.y)<32)cancelBrowserGesture(e);
 lastTap=e.touches.length?null:{target:ui,time:e.timeStamp,x:t.clientX,y:t.clientY};
},{passive:false,capture:true});
document.addEventListener('wheel',e=>{if(e.ctrlKey)cancelBrowserGesture(e)},{passive:false});
