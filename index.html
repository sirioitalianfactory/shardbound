<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#101a2c"><title>Shardbound</title><style>
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}body{margin:0;background:#101a2c;color:#effbff;font:15px system-ui;overflow:hidden}canvas{display:block;width:100%;height:100dvh}button{color:inherit;font:inherit;border:1px solid #ffffff35;border-radius:16px;background:#20334c;padding:14px 20px;cursor:pointer}button:active{background:#37768a}.hud{position:absolute;top:max(16px,env(safe-area-inset-top));left:18px;right:18px;display:flex;justify-content:space-between;pointer-events:none}.label{font-size:10px;letter-spacing:3px;color:#8da8bf}.title{font-weight:800;letter-spacing:2px}.bar{margin-top:8px;width:150px;height:6px;background:#ffffff20;border-radius:4px}.fill{height:100%;background:#74edbb;border-radius:4px}.tools{pointer-events:auto;display:flex;gap:8px}.tools button{padding:10px}.panel{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#0912209c;backdrop-filter:blur(9px);padding:22px}.card{width:440px;max-width:100%;padding:32px;background:linear-gradient(145deg,#20384bee,#101e32ee);border:1px solid #7ec6d544;border-radius:26px;box-shadow:0 25px 100px #0006}.card h1{font-size:42px;letter-spacing:3px;margin:10px 0}.card p{color:#b1c5d6;line-height:1.6}.primary{background:#75e3bd;color:#102f2b;font-weight:800;width:100%}.hidden{display:none!important}.controls{position:absolute;bottom:max(24px,env(safe-area-inset-bottom));left:22px;right:22px;display:flex;align-items:end;justify-content:space-between;pointer-events:none}#stick{width:124px;height:124px;background:#9dc6df12;border:1px solid #aacfe333;border-radius:50%;pointer-events:auto;position:relative}#knob{position:absolute;left:42px;top:42px;width:40px;height:40px;border-radius:50%;background:#bce7ec80;pointer-events:none}.actions{display:flex;gap:12px;align-items:end;pointer-events:auto}.actions button{width:76px;height:76px;border-radius:50%;font-size:12px;font-weight:800;padding:0;background:#31516bcc}#attack{width:88px;height:88px;background:#57bca2cc}#hint{position:absolute;top:108px;left:15px;right:15px;text-align:center;color:#c3e1e5;font-size:13px;pointer-events:none}.upgrade{display:block;width:100%;text-align:left;margin:10px 0}.upgrade small{display:block;color:#a9c5d2;margin-top:5px}@media(min-width:900px){.controls{opacity:.6}.card{width:480px}}</style>
<canvas id="game"></canvas><div class="hud"><div><div class="label">SIRIO ITALIAN FACTORY</div><div class="title">SHARDBOUND</div><div class="bar"><div id="health" class="fill"></div></div><div id="stats" style="margin-top:8px;font-size:12px"></div></div><div class="tools"><button id="sound" aria-label="Toggle sound">♫ OFF</button><button id="pause" aria-label="Pause">Ⅱ</button></div></div><div id="hint"></div><div class="controls"><div id="stick" aria-label="Movement joystick"><div id="knob"></div></div><div class="actions"><button id="dash">DASH</button><button id="attack">STRIKE</button></div></div><div id="overlay" class="panel"><div id="card" class="card"></div></div>
<script>
'use strict';
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),$=s=>document.querySelector(s);let W=0,H=0,D=1,time=0,last=0,mode='menu',level=1,kills=0,shards=0,best=0,shake=0,notice=0,audio=null,sound=false,musicClock=0;try{best=+localStorage.getItem('shardbound-best')||0}catch{}
const keys=new Set(),joy={x:0,y:0,id:null},hero={x:0,y:0,hp:100,max:100,speed:3.8,power:24,range:2.1,attack:0,dash:0,inv:0,faceX:1,faceY:0};let enemies=[],crystals=[],particles=[],slash=0,spawn=0,bossSpawned=false,goal=8;const N=9;
function resize(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);canvas.width=W*D;canvas.height=H*D;ctx.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
function project(x,y,z=0){const scale=Math.min(W/23,H/25,42);return{x:W/2+(x-y)*scale,y:H*.46+(x+y)*scale*.5-z*scale,s:scale}}
function poly(points,color){ctx.fillStyle=color;ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.fill()}
function tile(x,y,color){const a=project(x,y),b=project(x+1,y),c=project(x+1,y+1),d=project(x,y+1);poly([a,b,c,d],color);ctx.strokeStyle='#7ae4cd0a';ctx.stroke()}
function block(x,y,h,color){let a=project(x-.35,y-.35,h),b=project(x+.35,y-.35,h),c=project(x+.35,y+.35,h),d=project(x-.35,y+.35,h),e=project(x+.35,y+.35),f=project(x-.35,y+.35),g=project(x+.35,y-.35);poly([b,g,e,c],'#183347');poly([d,c,e,f],'#244b59');poly([a,b,c,d],color)}
function tone(freq,dur=.12,type='sine',volume=.05){if(!sound||!audio)return;const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(volume,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}
function message(text){$('#hint').textContent=text;notice=4}
function burst(x,y,color,n=12){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*5,vy:(Math.random()-.5)*5,life:.7,z:Math.random(),color})}
function show(html){$('#card').innerHTML=html;$('#overlay').classList.remove('hidden')}
function hide(){$('#overlay').classList.add('hidden')}
function start(){Object.assign(hero,{x:0,y:0,hp:100,max:100,speed:3.8,power:24,range:2.1,attack:0,dash:0,inv:0});level=1;kills=0;shards=0;nextLevel();hide();mode='playing';audio?.resume()}
function nextLevel(){enemies=[];crystals=[];particles=[];bossSpawned=false;spawn=.7;goal=6+level*2;hero.x=0;hero.y=0;message('Collect '+goal+' crystals to summon the guardian')}
function addEnemy(boss=false){let angle=Math.random()*Math.PI*2;enemies.push({x:Math.cos(angle)*7,y:Math.sin(angle)*7,hp:boss?130+level*60:32+level*7,max:boss?130+level*60:32+level*7,speed:boss?1.25:1.1+Math.random()*.5+level*.05,boss,cd:1,pulse:0})}
function strike(){if(mode!=='playing'||hero.attack>0)return;hero.attack=.42;slash=.22;tone(240,.12,'triangle');for(const e of enemies){if(Math.hypot(e.x-hero.x,e.y-hero.y)<hero.range+(e.boss?.6:0)){e.hp-=hero.power;e.pulse=.18;const a=Math.atan2(e.y-hero.y,e.x-hero.x);e.x+=Math.cos(a)*.55;e.y+=Math.sin(a)*.55;burst(e.x,e.y,'#8af7d5',5)}}}
function dash(){if(mode!=='playing'||hero.dash>0)return;hero.dash=1.7;hero.inv=.38;hero.x=Math.max(-7.8,Math.min(7.8,hero.x+hero.faceX*2.4));hero.y=Math.max(-7.8,Math.min(7.8,hero.y+hero.faceY*2.4));burst(hero.x,hero.y,'#84d9ff');tone(420,.15,'sine')}
function end(){mode='over';best=Math.max(best,level);try{localStorage.setItem('shardbound-best',best)}catch{}show('<div class="label">EXPEDITION COMPLETE</div><h1>Fallen.<br>Try again.</h1><p>Island '+level+' · '+kills+' enemies defeated<br>Best island: '+best+'</p><button class="primary" id="restart">PLAY AGAIN</button>');$('#restart').onclick=start}
function upgrade(){mode='upgrade';hero.hp=Math.min(hero.max,hero.hp+30);show('<div class="label">GUARDIAN DEFEATED</div><h1>Grow stronger.</h1><p>Choose a gift before island '+(level+1)+'.</p><button class="upgrade" data-up="power">Storm blade<small>+12 strike damage</small></button><button class="upgrade" data-up="health">Living armor<small>+25 maximum health and full heal</small></button><button class="upgrade" data-up="range">Wide arc<small>+0.4 strike range and +8% movement speed</small></button>');document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{if(b.dataset.up==='power')hero.power+=12;if(b.dataset.up==='health'){hero.max+=25;hero.hp=hero.max}if(b.dataset.up==='range'){hero.range+=.4;hero.speed*=1.08}level++;shards=0;nextLevel();hide();mode='playing'})}
function update(dt){time+=dt;if(mode!=='playing')return;hero.attack=Math.max(0,hero.attack-dt);hero.dash=Math.max(0,hero.dash-dt);hero.inv=Math.max(0,hero.inv-dt);slash=Math.max(0,slash-dt);shake=Math.max(0,shake-dt);notice-=dt;if(notice<0)$('#hint').textContent='';let sx=joy.x+(keys.has('ArrowRight')||keys.has('d')?1:0)-(keys.has('ArrowLeft')||keys.has('a')?1:0),sy=joy.y+(keys.has('ArrowDown')||keys.has('s')?1:0)-(keys.has('ArrowUp')||keys.has('w')?1:0);let wx=sx+sy,wy=sy-sx,m=Math.hypot(wx,wy);if(m>.1){const strength=Math.min(1,Math.hypot(sx,sy));wx/=m;wy/=m;hero.faceX=wx;hero.faceY=wy;hero.x=Math.max(-7.8,Math.min(7.8,hero.x+wx*hero.speed*dt*strength));hero.y=Math.max(-7.8,Math.min(7.8,hero.y+wy*hero.speed*dt*strength))}if(keys.has(' ')||keys.has('j')||attackHeld)strike();if(keys.has('Shift')||keys.has('k'))dash();spawn-=dt;if(spawn<0&&!bossSpawned&&enemies.length<10){addEnemy();spawn=Math.max(.6,1.7-level*.1)}for(const e of enemies){e.pulse=Math.max(0,e.pulse-dt);e.cd-=dt;let dx=hero.x-e.x,dy=hero.y-e.y,d=Math.hypot(dx,dy);if(d>.6){e.x+=dx/d*e.speed*dt;e.y+=dy/d*e.speed*dt}if(e.boss&&e.cd<=0){e.cd=3;burst(e.x,e.y,'#fa9a81',24);if(d<3&&hero.inv<=0){hero.hp-=20;hero.inv=.7;shake=.25}}if(d<(e.boss?1:.7)&&hero.inv<=0){hero.hp-=e.boss?18:10;hero.inv=.7;shake=.2;tone(90,.15,'sawtooth')}}for(let i=enemies.length-1;i>=0;i--)if(enemies[i].hp<=0){const e=enemies[i];enemies.splice(i,1);kills++;burst(e.x,e.y,e.boss?'#ffc481':'#75d6e2',18);if(e.boss){upgrade();return}crystals.push({x:e.x,y:e.y})}for(let i=crystals.length-1;i>=0;i--){let c=crystals[i],d=Math.hypot(c.x-hero.x,c.y-hero.y);if(d<2){c.x+=(hero.x-c.x)*dt*6;c.y+=(hero.y-c.y)*dt*6}if(d<.5){crystals.splice(i,1);shards++;tone(600+shards*30);if(shards>=goal&&!bossSpawned){bossSpawned=true;enemies=[];addEnemy(true);message('Guardian awakened! Dash away from its orange shockwave.')}}}for(const p of particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=dt*.8}particles=particles.filter(p=>p.life>0);if(hero.hp<=0)end();musicClock-=dt;if(musicClock<=0){musicClock=.5;const notes=[130.81,164.81,196,261.63,196,164.81];tone(notes[Math.floor(time*2)%notes.length],.4,'sine',.025)}$('#health').style.width=100*Math.max(0,hero.hp)/hero.max+'%';$('#stats').textContent='ISLAND '+level+'  ·  '+Math.min(shards,goal)+' / '+goal+' SHARDS';$('#dash').style.opacity=hero.dash>0?.45:1}
function actor(e,isHero=false){const p=project(e.x,e.y),r=p.s*(e.boss?.62:.32);ctx.fillStyle='#0005';ctx.beginPath();ctx.ellipse(p.x,p.y+3,r*1.3,r*.5,0,0,7);ctx.fill();if(e.boss){ctx.strokeStyle='#ff9a7766';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(p.x,p.y,p.s*3,p.s*1.5,0,0,7);ctx.stroke()}ctx.save();if(isHero&&hero.inv>0&&Math.floor(time*18)%2)ctx.globalAlpha=.4;const c=isHero?'#b9fae1':e.pulse>0?'#fff':e.boss?'#e28c73':'#6e8cce';block(e.x,e.y,isHero?.85:e.boss?1.4:.65,c);ctx.fillStyle=isHero?'#edfef9':'#fff0d9';ctx.beginPath();ctx.arc(p.x,p.y-p.s*(isHero?1.02:e.boss?1.55:.82),r*.75,0,7);ctx.fill();if(isHero){ctx.strokeStyle='#84f9d8';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(p.x+r,p.y-p.s*.65);ctx.lineTo(p.x+r*1.8,p.y-p.s*1.2);ctx.stroke()}ctx.restore();if(e.boss){ctx.fillStyle='#162337';ctx.fillRect(p.x-40,p.y-p.s*2,80,5);ctx.fillStyle='#ffae8d';ctx.fillRect(p.x-40,p.y-p.s*2,80*Math.max(0,e.hp/e.max),5)}}
function draw(){ctx.clearRect(0,0,W,H);const g=ctx.createRadialGradient(W/2,H*.4,20,W/2,H*.5,H*.7);g.addColorStop(0,'#213a4a');g.addColorStop(1,'#0b1324');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.save();if(shake>0)ctx.translate((Math.random()-.5)*8,(Math.random()-.5)*8);for(let x=-N;x<N;x++)for(let y=-N;y<N;y++){if(x===-N||y===-N||x===N-1||y===N-1)tile(x,y,'#172c3b');else tile(x,y,(x+y)%2?'#24464c':'#284c51')}for(const [x,y]of[[-8,-8],[-8,8],[8,-8],[8,8]])block(x,y,1.7,'#3e7d80');for(const c of crystals){const p=project(c.x,c.y,.4+Math.sin(time*4)*.1);poly([{x:p.x,y:p.y-9},{x:p.x+6,y:p.y},{x:p.x,y:p.y+9},{x:p.x-6,y:p.y}],'#94ffe1')}const list=enemies.map(e=>({e,h:false}));list.push({e:hero,h:true});list.sort((a,b)=>a.e.x+a.e.y-b.e.x-b.e.y);for(const item of list)actor(item.e,item.h);if(slash>0){const p=project(hero.x,hero.y,.6);ctx.strokeStyle='#b3ffe4';ctx.lineWidth=5;ctx.globalAlpha=slash/.22;ctx.beginPath();ctx.ellipse(p.x,p.y,p.s*hero.range,p.s*hero.range*.5,0,time*2,time*2+Math.PI*1.6);ctx.stroke();ctx.globalAlpha=1}for(const q of particles){const p=project(q.x,q.y,q.z);ctx.globalAlpha=Math.max(0,q.life/.7);ctx.fillStyle=q.color;ctx.fillRect(p.x,p.y,4,4)}ctx.globalAlpha=1;ctx.restore()}
let attackHeld=false;function bindHold(el,down,up){el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture(e.pointerId);down()});for(const ev of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(ev,up)}bindHold($('#attack'),()=>{attackHeld=true;strike()},()=>attackHeld=false);bindHold($('#dash'),dash,()=>{});
const stick=$('#stick');function moveStick(e){const r=stick.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,m=Math.hypot(dx,dy),scale=m>44?44/m:1;joy.x=dx*scale/44;joy.y=dy*scale/44;$('#knob').style.transform='translate('+dx*scale+'px,'+dy*scale+'px)'}stick.onpointerdown=e=>{if(joy.id!==null)return;joy.id=e.pointerId;stick.setPointerCapture(e.pointerId);moveStick(e)};stick.onpointermove=e=>{if(e.pointerId===joy.id)moveStick(e)};function resetJoy(){joy.id=null;joy.x=joy.y=0;$('#knob').style.transform=''}for(const ev of ['pointerup','pointercancel','lostpointercapture'])stick.addEventListener(ev,resetJoy);addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();keys.add(e.key);if(e.key==='Escape')pause()});addEventListener('keyup',e=>keys.delete(e.key));function pause(){if(mode==='playing'){mode='paused';show('<div class="label">TAKE A BREATH</div><h1>Paused.</h1><button class="primary" id="resume">RESUME</button>');$('#resume').onclick=pause}else if(mode==='paused'){hide();mode='playing'}}$('#pause').onclick=pause;addEventListener('blur',()=>{keys.clear();resetJoy();attackHeld=false;if(mode==='playing')pause()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='playing')pause()});$('#sound').onclick=()=>{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();sound=!sound;$('#sound').textContent=sound?'♫ ON':'♫ OFF'};
show('<div class="label">AN ISOMETRIC EXPEDITION</div><h1>SHARD<br>BOUND</h1><p>Walk the floating ruins. Strike the sentinels, gather their crystals, and defeat each island’s guardian.</p><p>Drag the joystick to move. Hold STRIKE to fight. DASH through danger.<br><small>Desktop: WASD / arrows · Space: strike · Shift: dash</small></p><button class="primary" id="start">ENTER THE RUINS →</button><p style="font-size:12px;margin-bottom:0">Best island: '+best+' · Sound optional</p>');$('#start').onclick=start;
function frame(t){const dt=Math.min((t-last)/1000,.035);last=t;update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
