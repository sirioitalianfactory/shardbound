function update(dt){time+=dt;if(mode!=='playing')return;hero.attack=Math.max(0,hero.attack-dt);hero.dash=Math.max(0,hero.dash-dt);hero.inv=Math.max(0,hero.inv-dt);slash=Math.max(0,slash-dt);shake=Math.max(0,shake-dt);notice-=dt;if(notice<0)$('#hint').textContent='';let sx=joy.x+(keys.has('ArrowRight')||keys.has('d')?1:0)-(keys.has('ArrowLeft')||keys.has('a')?1:0),sy=joy.y+(keys.has('ArrowDown')||keys.has('s')?1:0)-(keys.has('ArrowUp')||keys.has('w')?1:0);let wx=sx+sy,wy=sy-sx,m=Math.hypot(wx,wy);if(m>.1){const strength=Math.min(1,Math.hypot(sx,sy));wx/=m;wy/=m;hero.faceX=wx;hero.faceY=wy;hero.x=Math.max(-7.8,Math.min(7.8,hero.x+wx*hero.speed*dt*strength));hero.y=Math.max(-7.8,Math.min(7.8,hero.y+wy*hero.speed*dt*strength))}if(keys.has(' ')||keys.has('j')||attackHeld)strike();if(keys.has('Shift')||keys.has('k'))dash();spawn-=dt;if(spawn<0&&!bossSpawned&&enemies.length<10){addEnemy();spawn=Math.max(.6,1.7-level*.1)}for(const e of enemies){e.pulse=Math.max(0,e.pulse-dt);e.cd-=dt;let dx=hero.x-e.x,dy=hero.y-e.y,d=Math.hypot(dx,dy);if(d>.6){e.x+=dx/d*e.speed*dt;e.y+=dy/d*e.speed*dt}if(e.boss&&e.cd<=0){e.cd=3;burst(e.x,e.y,'#fa9a81',24);if(d<3&&hero.inv<=0){hero.hp-=20;hero.inv=.7;shake=.25}}if(d<(e.boss?1:.7)&&hero.inv<=0){hero.hp-=e.boss?18:10;hero.inv=.7;shake=.2;tone(90,.15,'sawtooth')}}for(let i=enemies.length-1;i>=0;i--)if(enemies[i].hp<=0){const e=enemies[i];enemies.splice(i,1);kills++;burst(e.x,e.y,e.boss?'#ffc481':'#75d6e2',18);if(e.boss){upgrade();return}crystals.push({x:e.x,y:e.y})}for(let i=crystals.length-1;i>=0;i--){let c=crystals[i],d=Math.hypot(c.x-hero.x,c.y-hero.y);if(d<2){c.x+=(hero.x-c.x)*dt*6;c.y+=(hero.y-c.y)*dt*6}if(d<.5){crystals.splice(i,1);shards++;tone(600+shards*30);if(shards>=goal&&!bossSpawned){bossSpawned=true;enemies=[];addEnemy(true);message('Guardian awakened! Dash away from its orange shockwave.')}}}for(const p of particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=dt*.8}particles=particles.filter(p=>p.life>0);if(hero.hp<=0)end();musicC x(0,q.life/.7);ctx.fillStyle=q.color;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(time*2+q.x);ctx.fillRect(-2,-2,3,5);ctx.restore()}ctx.globalAlpha=1;}ctx.restore();const vignette=ctx.createRadialGradient(W/2,H*.45,Math.min(W,H)*.2,W/2,H*.45,Math.max(W,H)*.75);vignette.addColorStop(0,'transparent');vignette.addColorStop(1,'#05101a99');ctx.fillStyle=vignette;ctx.fillRect(0,0,W,H)}

const stick=$('#stick');function moveStick(e){const r=stick.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,m=Math.hypot(dx,dy),scale=m>44?44/m:1;joy.x=dx*scale/44;joy.y=dy*scale/44;$('#knob').style.transform='translate('+dx*scale+'px,'+dy*scale+'px)'}stick.onpointerdown=e=>{if(joy.id!==null)return;joy.id=e.pointerId;stick.setPointerCapture(e.pointerId);moveStick(e)};stick.onpointermove=e=>{if(e.pointerId===joy.id)moveStick(e)};function resetJoy(){joy.id=null;joy.x=joy.y=0;$('#knob').style.transform=''}for(const ev of ['pointerup','pointercancel','lostpointercapture'])stick.addEventListener(ev,resetJoy);addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();keys.add(e.key);if(e.key==='Escape')pause()});addEventListener('keyup',e=>keys.delete(e.key));function pause(){if(mode==='playing'){mode='paused';show('<div class="label">TAKE A BREATH</div><h1>Paused.</h1><button class="primary" id="resume">RESUME</button>');$('#resume').onclick=pause}else if(mode==='paused'){hide();mode='playing'}}$('#pause').onclick=pause;addEventListener('blur',()=>{keys.clear();resetJoy();attackHeld=false;if(mode==='playing')pause()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='playing')pause()});$('#sound').onclick=()=>{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();sound=!sound;$('#sound').textContent=sound?'♫ ON':'♫ OFF'};
